# Render 一键部署：render.com 用 GitHub 登录 → New + → Blueprint → 选本仓库
services:
  - type: web
    name: xiongling-1beta-pro-sm
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt && python3 train.py --backend numpy --data data/sample.txt --out model --epochs 3
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # 唯一的一把钥匙
      - key: XL_API_KEY
        value: sk-xionglingautobaiduscshumi
      # auto = 先用真模型，失败回落本地小模型
      - key: XL_BACKEND
        value: auto
      # 真模型通道（免费，OpenAI 格式）
      - key: XL_UPSTREAM_URL
        value: https://text.pollinations.ai/openai
      - key: XL_UPSTREAM_MODEL
        value: openai
      # 想换成 Hugging Face，把 URL 改成 router 并填 token
      - key: HF_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.5
