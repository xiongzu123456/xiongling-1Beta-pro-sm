<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XiongLing 1Beta pro sm · App</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --line:#222c38; --txt:#e6edf3;
    --dim:#8b98a8; --brand:#3ad1c0; --brand2:#1f8f83;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(900px 500px at 15% -10%,#123b3a 0%,transparent 60%),var(--bg);
    color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(13,17,23,.88);backdrop-filter:blur(12px);z-index:10}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
  .title{font-weight:600;font-size:16px;letter-spacing:.3px}
  .model-tag{font-size:11px;color:var(--brand);border:1px solid var(--brand2);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .spacer{flex:1}
  .gear{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}

  .settings{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:none}
  .settings.open{display:block}
  .row{margin-bottom:10px}
  .row label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .row input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0b1017;color:var(--txt);font-size:14px;outline:none}
  .row input:focus{border-color:var(--brand2)}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--dim);font-size:13px;cursor:pointer}
  .seg button.on{border-color:var(--brand2);color:var(--brand);background:rgba(58,209,192,.08)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6}

  main{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#1c4a47,#173a3d);border:1px solid #245a56}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.err{align-self:stretch;max-width:100%;background:#2a1618;border:1px solid #5c2b2f;color:#ffb3b8;font-size:13px}
  .meta{font-size:11px;color:var(--dim);margin-top:8px}
  .dl{display:inline-block;margin-top:8px;color:var(--brand);text-decoration:none;font-size:13px;
    border:1px solid var(--brand2);padding:6px 11px;border-radius:8px;cursor:pointer}
  .welcome{color:var(--dim);font-size:13px;text-align:center;margin:auto 0;line-height:2}
  .welcome b{color:var(--txt);display:block;font-size:18px;margin-bottom:8px}

  footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(13,17,23,.92);backdrop-filter:blur(12px);position:sticky;bottom:0}
  .modes{display:flex;gap:8px;margin-bottom:8px}
  .chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    color:var(--dim);cursor:pointer;background:transparent}
  .chip.on{border-color:var(--brand2);color:var(--brand);background:rgba(58,209,192,.08)}
  .composer{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line);background:#0b1017;color:var(--txt);font-size:14.5px;
    font-family:inherit;outline:none;line-height:1.5}
  textarea:focus{border-color:var(--brand2)}
  .send{width:46px;height:44px;border-radius:12px;border:none;background:var(--brand);
    color:#04211f;font-size:18px;cursor:pointer;flex:none}
  .send:disabled{opacity:.4}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <span class="title">XiongLing</span>
  <span class="model-tag">xiongling-1Beta-pro-sm</span>
  <span class="spacer"></span>
  <button class="gear" id="gear">设置</button>
</header>

<section class="settings" id="settings">
  <div class="seg">
    <button id="mPublic" class="on">公共通道（免服务器）</button>
    <button id="mOwn">自己的 API</button>
  </div>
  <div class="row" id="ownBox" style="display:none">
    <label>API 地址</label>
    <input id="apiBase" placeholder="https://你的服务地址" autocomplete="off">
  </div>
  <div class="row" id="keyBox" style="display:none">
    <label>API Key</label>
    <input id="apiKey" placeholder="sk-..." autocomplete="off">
  </div>
  <div class="hint" id="connHint">公共通道直接由浏览器连模型接口，不需要任何服务器和 Key。</div>
</section>

<main id="chat">
  <div class="welcome">
    <b>雄灵一号 · 已就绪</b>
    直接打字就能聊<br>
    也可以切到「生成文件」，让它写一份文档给你下载
  </div>
</main>

<footer>
  <div class="modes">
    <button class="chip on" data-mode="chat">聊天</button>
    <button class="chip" data-mode="file">生成文件</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么，比如：你是谁"></textarea>
    <button class="send" id="send">➤</button>
  </div>
</footer>

<script>
const PUBLIC_URL = 'https://text.pollinations.ai/openai';
const SYSTEM_PROMPT = '你是雄灵一号（xiongling-1Beta-pro-sm），一个中文 AI 助手。回答直接、简洁，不要啰嗦，不要自称其他模型。';
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');

let cfg = {
  mode: localStorage.getItem('xl_mode') || 'public',
  base: localStorage.getItem('xl_base') || '',
  key:  localStorage.getItem('xl_key')  || ''
};
let mode = 'chat';

$('gear').onclick = () => $('settings').classList.toggle('open');

function renderCfg() {
  const own = cfg.mode === 'own';
  $('mPublic').classList.toggle('on', !own);
  $('mOwn').classList.toggle('on', own);
  $('ownBox').style.display = own ? 'block' : 'none';
  $('keyBox').style.display = own ? 'block' : 'none';
  $('apiBase').value = cfg.base;
  $('apiKey').value = cfg.key;
  $('connHint').textContent = own
    ? '填上后端地址和 Key，改完会自动保存。'
    : '公共通道直接由浏览器连模型接口，不需要任何服务器和 Key。';
}

function saveCfg() {
  if (cfg.mode === 'own') {
    cfg.base = $('apiBase').value.trim().replace(/\/+$/,'');
    cfg.key = $('apiKey').value.trim();
  }
  localStorage.setItem('xl_mode', cfg.mode);
  localStorage.setItem('xl_base', cfg.base);
  localStorage.setItem('xl_key', cfg.key);
  renderCfg();
}

$('mPublic').onclick = () => { cfg.mode='public'; saveCfg(); };
$('mOwn').onclick = () => { cfg.mode='own'; saveCfg(); };
$('apiBase').addEventListener('change', saveCfg);
$('apiKey').addEventListener('change', saveCfg);
renderCfg();

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  mode = c.dataset.mode;
  input.placeholder = mode === 'chat' ? '说点什么，比如：你是谁' : '描述你想要的文档，比如：写一份训练说明';
});

function bubble(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

let welcome = chat.querySelector('.welcome');
function clearWelcome(){ if (welcome && welcome.parentNode) { welcome.remove(); welcome = null; } }

async function generate(userText, maxTokens) {
  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    { role: 'user', content: userText }
  ];

  if (cfg.mode === 'own') {
    if (!cfg.base) throw new Error('还没填 API 地址');
    const r = await fetch(cfg.base.replace(/\/+$/,'') + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': cfg.key },
      body: JSON.stringify({ model: 'xiongling-1Beta-pro-sm', messages, max_tokens: maxTokens })
    });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error('HTTP ' + r.status + '：' + JSON.stringify(j).slice(0, 120));
    return { text: j.choices[0].message.content, from: '自己的 API' };
  }

  const r = await fetch(PUBLIC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'openai', messages, stream: false })
  });
  const raw = await r.text();
  let j;
  try { j = JSON.parse(raw); } catch (e) { throw new Error('返回不是 JSON：' + raw.slice(0,120)); }
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  const text = (((j.choices || [])[0] || {}).message || {}).content || '';
  if (!text.trim()) throw new Error('模型没返回内容，稍后再试');
  return { text: text.trim(), from: '公共通道' };
}

async function run() {
  const text = input.value.trim();
  if (!text) return;
  clearWelcome();
  bubble(text, 'user');
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;
  const wait = bubble('正在生成…', 'bot');

  try {
    if (mode === 'chat') {
      const res = await generate(text, 400);
      wait.textContent = res.text;
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = '来自：' + res.from;
      wait.appendChild(m);
    } else {
      const res = await generate('请根据下面的要求写一份文档，直接输出正文，不要解释：\n' + text, 900);
      wait.textContent = res.text;
      const blob = new Blob(['# ' + text + '\n\n' + res.text], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.className = 'dl';
      a.href = url;
      a.download = 'xiongling-' + Date.now() + '.md';
      a.textContent = '下载 .md 文件';
      wait.appendChild(document.createElement('br'));
      wait.appendChild(a);
    }
  } catch (e) {
    wait.className = 'msg err';
    wait.textContent = '失败：' + e.message;
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

sendBtn.onclick = run;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
