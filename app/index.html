<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XiongLing 1Beta pro sm · App</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --line:#222c38; --txt:#e6edf3;
    --dim:#8b98a8; --brand:#3ad1c0; --brand2:#1f8f83;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(900px 500px at 15% -10%,#123b3a 0%,transparent 60%),var(--bg);
    color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    padding:14px 16px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,17,23,.85);
    backdrop-filter:blur(12px);z-index:10;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
  .title{font-weight:600;font-size:16px;letter-spacing:.3px}
  .model-tag{font-size:11px;color:var(--brand);border:1px solid var(--brand2);
    padding:2px 8px;border-radius:20px;white-space:nowrap}
  .spacer{flex:1}
  .gear{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:6px 10px;font-size:13px;cursor:pointer}
  .gear:active{transform:scale(.97)}

  .settings{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:none}
  .settings.open{display:block}
  .row{margin-bottom:10px}
  .row label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .row input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0b1017;color:var(--txt);font-size:14px;outline:none}
  .row input:focus{border-color:var(--brand2)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
  .actions{display:flex;gap:8px}
  .btn{border:none;border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;
    background:var(--brand);color:#04211f;font-weight:600}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  .btn:disabled{opacity:.45}

  main{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#1c4a47,#173a3d);border:1px solid #245a56}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.err{align-self:stretch;max-width:100%;background:#2a1618;border:1px solid #5c2b2f;color:#ffb3b8;font-size:13px}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}
  .dl{display:inline-block;margin-top:8px;color:var(--brand);text-decoration:none;font-size:13px;
    border:1px solid var(--brand2);padding:5px 10px;border-radius:8px}
  .welcome{color:var(--dim);font-size:13px;text-align:center;margin:auto 0;line-height:2}
  .welcome b{color:var(--txt);display:block;font-size:18px;margin-bottom:8px}

  footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(13,17,23,.9);backdrop-filter:blur(12px);position:sticky;bottom:0}
  .composer{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line);background:#0b1017;color:var(--txt);font-size:14.5px;
    font-family:inherit;outline:none;line-height:1.5}
  textarea:focus{border-color:var(--brand2)}
  .send{width:46px;height:44px;border-radius:12px;border:none;background:var(--brand);
    color:#04211f;font-size:18px;cursor:pointer;flex:none}
  .send:disabled{opacity:.4}
  .modes{display:flex;gap:8px;margin-bottom:8px}
  .chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    color:var(--dim);cursor:pointer;background:transparent}
  .chip.on{border-color:var(--brand2);color:var(--brand);background:rgba(58,209,192,.08)}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <span class="title">XiongLing</span>
  <span class="model-tag">xiongling-1Beta-pro-sm</span>
  <span class="spacer"></span>
  <button class="gear" id="gear">设置</button>
</header>

<section class="settings" id="settings">
  <div class="row">
    <label>API 地址（部署后的后端地址）</label>
    <input id="apiBase" placeholder="https://你的服务地址" autocomplete="off">
  </div>
  <div class="row">
    <label>API Key（本模型只签发一把）</label>
    <input id="apiKey" autocomplete="off">
  </div>
  <div class="actions">
    <button class="btn" id="save">保存并测试连接</button>
    <button class="btn ghost" id="reset">恢复默认</button>
  </div>
  <div class="hint" id="connHint">填好后点“保存并测试连接”，会请求 /health 确认后端在线。</div>
</section>

<main id="chat">
  <div class="welcome">
    <b>雄灵一号 · 已就绪</b>
    先到“设置”里填后端地址与 API Key<br>
    然后可以聊天，也可以让它直接产出一个文件
  </div>
</main>

<footer>
  <div class="modes">
    <button class="chip on" data-mode="chat">聊天</button>
    <button class="chip" data-mode="file">生成文件</button>
    <span class="spacer"></span>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么，比如：雄灵一号能做什么"></textarea>
    <button class="send" id="send">➤</button>
  </div>
</footer>

<script>
const DEFAULTS = {
  base: localStorage.getItem('xl_base') || 'http://127.0.0.1:8000',
  key:  localStorage.getItem('xl_key')  || 'sk-xionglingautobaiduscshumi'
};
let mode = 'chat';
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');

$('apiBase').value = DEFAULTS.base;
$('apiKey').value  = DEFAULTS.key;

$('gear').onclick = () => $('settings').classList.toggle('open');

$('save').onclick = async () => {
  const base = $('apiBase').value.trim().replace(/\/+$/, '');
  const key  = $('apiKey').value.trim();
  localStorage.setItem('xl_base', base);
  localStorage.setItem('xl_key', key);
  $('connHint').textContent = '正在测试连接…';
  try {
    const r = await fetch(base + '/health');
    const j = await r.json();
    $('connHint').textContent = j.status === 'ok'
      ? `后端在线 · ${j.model} · 后端类型 ${j.backend}`
      : '后端返回异常：' + JSON.stringify(j);
  } catch (e) {
    $('connHint').textContent = '连接失败：' + e.message + '（检查地址、是否开启了 CORS）';
  }
};

$('reset').onclick = () => {
  localStorage.removeItem('xl_base'); localStorage.removeItem('xl_key');
  $('apiBase').value = 'http://127.0.0.1:8000';
  $('apiKey').value = 'sk-xionglingautobaiduscshumi';
  $('connHint').textContent = '已恢复默认。';
};

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  mode = c.dataset.mode;
  input.placeholder = mode === 'chat'
    ? '说点什么，比如：雄灵一号能做什么'
    : '描述你想要的文档，比如：写一份训练记录说明';
});

function bubble(text, who, extra) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  if (extra) d.appendChild(extra);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

const first = chat.querySelector('.welcome');
function clearWelcome(){ if (first && first.parentNode) first.remove(); }

async function callApi(path, body) {
  const base = (localStorage.getItem('xl_base') || DEFAULTS.base).replace(/\/+$/, '');
  const key  = localStorage.getItem('xl_key') || DEFAULTS.key;
  const r = await fetch(base + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key },
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({ detail: '响应不是合法 JSON' }));
  if (!r.ok) throw new Error((j.error && j.error.message) || j.detail || ('HTTP ' + r.status));
  return j;
}

async function run() {
  const text = input.value.trim();
  if (!text) return;
  clearWelcome();
  bubble(text, 'user');
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;
  const wait = bubble('正在生成…', 'bot');

  try {
    if (mode === 'chat') {
      const j = await callApi('/v1/chat/completions', {
        messages: [{ role: 'user', content: text }],
        max_tokens: 180, temperature: 0.8
      });
      wait.textContent = j.choices[0].message.content;
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = `${j.model} · ${j.usage.completion_tokens} tokens`;
      wait.appendChild(m);
    } else {
      const j = await callApi('/v1/files', {
        prompt: text, filename: 'xiongling', ext: 'md',
        max_tokens: 220, temperature: 0.8
      });
      wait.textContent = '文件已生成：' + j.file + '\n\n' + (j.preview || '');
      const a = document.createElement('a');
      a.className = 'dl'; a.href = j.download_url;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '下载 ' + j.file;
      wait.appendChild(document.createElement('br'));
      wait.appendChild(a);
    }
  } catch (e) {
    wait.className = 'msg err';
    wait.textContent = '请求失败：' + e.message;
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

sendBtn.onclick = run;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
